source [find interface/ftdi/tigard.cfg]

#adapter driver ftdi
#interface ftdi
#ftdi_vid_pid 0x0403 0x6010
#ftdi_channel 1
#adapter_khz 1000
#ftdi_layout_init 0x0038 0x003b
#adapter speed 1000
#ftdi_layout_signal nTRST -data 0x0010
#ftdi_layout_signal nSRST -data 0x0020

adapter speed 1000
transport select jtag
reset_config none

#transport select jtag

# FTF232
#ftdi_vid_pid 0x0403 0x6014

#ftdi_channel 0
#ftdi_layout_init 0x00e8 0x60eb


#echo "ftdi setting..."

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10001c05

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

echo "target created..."

#log_output openocd_fpga.log

#riscv set_ir idcode 0x09
#riscv set_ir dtmcs 0x22
#riscv set_ir dmi 0x23

#riscv set_reset_timeout_sec 2
#riscv set_command_timeout_sec 2

# prefer to use sba for system bus access
#riscv set_prefer_sba off

echo "setting preferences..."

scan_chain

init

echo "init routine started"

halt
echo "Ready for Remote Connections"
